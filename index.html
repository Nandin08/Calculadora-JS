<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--Cabeçalho-->
    <header>
        <h1>Calculadora</h1>
    </header>


    <!--Principal-->
    <main>
        <div id="container">
            <div id="display">
                <p id="resultado">0</p>
                 <div id="limpar"><button id="clean">C</button></div> 
            </div>

       

            <div id="botoes">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>0</button>
                <button>+</button>
                <button>-</button>
                <button>/</button>
                <button>X</button>
                <button>.</button>
                <button>=</button>

            </div>
        </div>


    </main>

</body>

</html>
